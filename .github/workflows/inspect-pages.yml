name: Inspect pages (temp)
on: workflow_dispatch
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in api/top game/ver.txt _worker.js functions game/ index.html; do echo "== $p"; curl -s -m 15 -o /tmp/o -w "%{http_code} %{content_type}\n" https://gorod-podpischikov.pages.dev/$p; head -c 160 /tmp/o; echo; done
          A=16c2383fa01f7aa60cfb5d8f9ecd216f
          curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/gorod-podpischikov/deployments?per_page=1 | python3 -c "import sys,json;d=json.load(sys.stdin)['result'][0];[print(k,json.dumps(d.get(k))[:300]) for k in ['id','uses_functions','build_config','deployment_trigger','stages','source']]"
          curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/gorod-podpischikov | python3 -c "import sys,json;d=json.load(sys.stdin)['result'];print(json.dumps(d.get('deployment_configs',{}).get('production',{}))[:800])"
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
