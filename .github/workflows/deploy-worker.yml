name: Deploy game server (gorod-bot)
on:
  push:
    branches: [main]
    paths: ['bot/**', 'wrangler.toml', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "::error::Добавь секрет CLOUDFLARE_API_TOKEN в Settings → Secrets → Actions"; exit 1; fi
      - name: Deploy worker
        run: npx --yes wrangler@3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Pages projects (info)
        continue-on-error: true
        run: npx --yes wrangler@3 pages project list && npx --yes wrangler@3 pages deployment list --project-name gorod-podpischikov | head -20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
