name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          U=https://gorod-podpischikov.pages.dev
          curl -sIL $U/game/world/index.html | grep -i -E "cache|etag|age"
          curl -sL $U/game/world/index.html | grep -o 'scene.js[^"]*'
          V=$(curl -sL $U/game/world/index.html | grep -o 'scene.js?v=[a-z0-9]*' | cut -d= -f2)
          curl -sL "$U/game/world/scene.js?v=$V" | grep -c "__BZD"
          curl -sL "$U/game/index.html" | grep -o "world/index.html?v=[a-z0-9]*"
          curl -sL $U/game/ | grep -o "world/index.html?v=[a-z0-9]*"
