<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Город</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#7cc4ff;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}#gl{position:fixed;inset:0;width:100%;height:100%}
#joy{position:fixed;left:18px;bottom:22px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.25),rgba(255,255,255,.1));border:2px solid rgba(255,255,255,.5);z-index:3;touch-action:none}#knob{position:absolute;left:38px;top:38px;width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.35);pointer-events:none}
#act{position:fixed;right:14px;bottom:40px;z-index:3;border:0;border-radius:20px;padding:16px 18px;font-size:17px;font-weight:900;color:#4a2508;background:linear-gradient(180deg,#ffe08a,#f2b33a);box-shadow:0 5px 0 #b97a12,0 10px 24px rgba(0,0,0,.35);display:none;animation:pl 1.2s infinite}@keyframes pl{50%{transform:scale(1.06)}}
.tb{position:fixed;z-index:3;border:0;border-radius:16px;padding:10px 12px;font-size:15px;font-weight:900;color:#fff;background:rgba(30,20,70,.75);backdrop-filter:blur(6px)}
#taxi{position:fixed;right:12px;top:58px;z-index:4;display:none;flex-direction:column;gap:6px;background:rgba(30,20,70,.9);padding:10px;border-radius:18px}#taxi.open{display:flex}#taxi button{border:0;border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px;text-align:left;background:rgba(255,255,255,.12);color:#fff}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(#4aa8ff,#cfeaff);z-index:9;font-weight:900;color:#2a1d55;font-size:20px}</style></head><body>
<div id="load"><div style="font-size:60px">🏙</div>Загружаем город…</div>
<canvas id="gl"></canvas><div id="joy"><div id="knob"></div></div><button id="act"></button>
<button class="tb" id="taxib" style="right:12px;top:12px">🚕 Такси</button><button class="tb" id="zin" style="left:12px;top:12px">＋</button><button class="tb" id="zout" style="left:62px;top:12px">－</button><div id="taxi"></div>
<script src="residents.js"></script><script type="importmap">{"imports":{"three":"./three.js"}}</script><script type="module" src="scene.js"></script></body></html>
