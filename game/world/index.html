<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Город</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#7cc4ff;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}#gl{position:fixed;inset:0;width:100%;height:100%}
#joy{position:fixed;left:18px;bottom:22px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.25),rgba(255,255,255,.1));border:2px solid rgba(255,255,255,.5);z-index:3;touch-action:none}#knob{position:absolute;left:38px;top:38px;width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.35);pointer-events:none}
#act{position:fixed;right:14px;bottom:40px;z-index:3;border:0;border-radius:20px;padding:16px 18px;font-size:17px;font-weight:900;color:#4a2508;background:linear-gradient(180deg,#ffe08a,#f2b33a);box-shadow:0 5px 0 #b97a12,0 10px 24px rgba(0,0,0,.35);display:none;animation:pl 1.2s infinite}@keyframes pl{50%{transform:scale(1.06)}}
.tb{position:fixed;z-index:3;border:0;border-radius:16px;padding:10px 12px;font-size:15px;font-weight:900;color:#fff;background:rgba(30,20,70,.75);backdrop-filter:blur(6px)}
#taxi{position:fixed;right:12px;top:58px;z-index:4;display:none;flex-direction:column;gap:6px;background:rgba(30,20,70,.9);padding:10px;border-radius:18px}#taxi.open{display:grid}#taxi button{border:0;border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px;text-align:left;background:rgba(255,255,255,.12);color:#fff}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(#4aa8ff,#cfeaff);z-index:9;font-weight:900;color:#2a1d55;font-size:20px}#onl{position:fixed;left:50%;transform:translateX(-50%);top:58px;z-index:3;background:rgba(30,20,70,.78);backdrop-filter:blur(6px);color:#fff;font-size:13px;padding:6px 12px;border-radius:14px;white-space:nowrap}#onl b{color:#7dff8a}
#emos{position:fixed;left:160px;right:150px;bottom:28px;z-index:3;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}#emos button{border:0;background:rgba(30,20,70,.7);border-radius:12px;font-size:20px;width:38px;height:38px;padding:0}#emos button:active{transform:scale(1.25)}
@media(max-width:420px){#emos{left:154px;right:12px;bottom:110px;justify-content:flex-end}}#botc{display:none;position:fixed;left:50%;top:96px;transform:translateX(-50%);z-index:5;background:rgba(30,20,70,.92);color:#fff;padding:10px 14px;border-radius:16px;font-size:14px;text-align:center;line-height:1.35;max-width:86vw}#botc small{color:#a79fd6}#sayb{position:fixed;right:12px;bottom:158px;z-index:4;border:0;width:52px;height:52px;border-radius:18px;font-size:26px;background:linear-gradient(180deg,#ffd77a,#f2b33a);box-shadow:0 4px 0 #b8801f}
#sayb:active{transform:translateY(3px);box-shadow:0 1px 0 #b8801f}
#sayp{position:fixed;left:10px;right:10px;bottom:220px;z-index:5;background:rgba(27,20,70,.94);border-radius:20px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#sayp.hidden{display:none}#sayp>button{border:0;border-radius:14px;padding:8px 11px;background:#fff;color:#2b2266;font-weight:800;font-size:13px}
#sayp form{display:flex;gap:6px;width:100%}#sayp input{flex:1;border:0;border-radius:14px;padding:11px;font-size:15px;background:#3b3170;color:#fff}#sayp form button{border:0;border-radius:14px;padding:0 16px;background:#ffc65c;font-weight:900;color:#3b2300}
#clog{position:fixed;left:10px;top:96px;max-width:62%;z-index:3;pointer-events:none;font:600 12px -apple-system,sans-serif;color:#fff}#clog div{background:rgba(27,20,70,.62);border-radius:10px;padding:4px 9px;margin-bottom:4px;text-shadow:0 1px 2px #000}#clog b{color:#ffc65c}

html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input{-webkit-user-select:text;user-select:text}
#fishb{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:6;border:0;border-radius:24px;padding:20px 34px;font:900 22px -apple-system,sans-serif;color:#fff;background:rgba(27,20,70,.85);box-shadow:0 6px 0 rgba(0,0,0,.3)}#fishb.hidden{display:none}
#fishb.bite{background:linear-gradient(180deg,#3ad46a,#1f9e48);font-size:30px;animation:fb .35s infinite alternate}@keyframes fb{to{transform:translateX(-50%) scale(1.12)}}
#taxi{grid-template-columns:1fr 1fr;gap:5px!important;padding:8px!important;max-height:calc(100vh - 140px);overflow:auto;width:min(300px,calc(100vw - 24px));box-sizing:border-box}#taxi button{padding:8px 8px!important;font-size:12.5px!important;border-radius:10px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#joy{width:108px!important;height:108px!important;left:14px!important;bottom:16px!important}#knob{width:44px!important;height:44px!important;left:30px!important;top:30px!important}
.tb{padding:7px 10px!important;font-size:12.5px!important;border-radius:12px!important}#zin,#zout{width:34px;text-align:center;padding:7px 0!important}#zout{left:52px!important}#fs{left:92px!important}
#taxib{top:10px!important;right:10px!important}#misb{top:50px!important;right:10px!important}#bagb2{top:86px!important;right:10px!important}
#onl{top:50px!important;font-size:11px!important;padding:4px 10px!important}
#act{padding:11px 14px!important;font-size:14px!important;border-radius:16px!important;bottom:20px!important;right:10px!important;max-width:58vw}
#emos button{width:32px!important;height:32px!important;font-size:17px!important;border-radius:10px!important}#emos{bottom:78px!important;right:10px!important}#sayb{width:42px!important;height:42px!important;font-size:21px!important;bottom:118px!important;right:10px!important;border-radius:14px!important}
#clog{top:128px!important;font-size:11px!important}

/* компактная верхняя панель */
.tb{padding:6px 9px!important;font-size:12px!important;border-radius:11px!important;line-height:1.1}
#zin,#zout,#mapb{width:30px!important;padding:6px 0!important;text-align:center}
#zin{left:8px!important;top:8px!important}#zout{left:42px!important;top:8px!important}#fs{left:76px!important;top:8px!important}#mapb{left:148px!important;top:8px!important}
#taxib,#misb,#bagb2,#rideb{right:8px!important;left:auto!important;min-width:84px;text-align:left}
#taxib{top:8px!important}#misb{top:39px!important}#bagb2{top:70px!important}#rideb{top:101px!important}
#hpw{left:8px!important;top:42px!important;transform:none!important;width:150px!important;background:rgba(30,20,70,.8);border-radius:10px;padding:4px 7px 5px;box-sizing:border-box;text-align:left!important;font-size:11px!important}
#hpw #chpl{margin-bottom:2px}
#onl{left:8px!important;top:78px!important;transform:none!important;font-size:10.5px!important;padding:3px 8px!important;border-radius:10px!important;max-width:calc(100vw - 112px);overflow:hidden;text-overflow:ellipsis}
#wch{left:8px!important;top:101px!important;max-width:calc(100vw - 112px)!important;font-size:10px!important;padding:3px 8px!important}
#clog{top:142px!important}
</style></head><body>
<div id="load"><div style="font-size:60px">🏙</div>Загружаем город…</div>
<canvas id="gl"></canvas><div id="joy"><div id="knob"></div></div><button id="act"></button>
<button class="tb" id="taxib" style="right:12px;top:12px">🚕 Такси</button><button class="tb" id="misb" style="right:12px;top:104px">🎯 Миссии</button><button class="tb" id="bagb2" style="right:12px;top:150px">🎒 Рюкзак</button><button class="tb" id="zin" style="left:12px;top:12px">＋</button><button class="tb" id="zout" style="left:62px;top:12px">－</button><div id="taxi"></div><div id="onl">🟢 город загружается…</div><div id="emos"></div><button id="sayb">💬</button><button id="fishb" class="hidden"></button><div id="sayp" class="hidden"></div><div id="clog"></div><div id="botc"></div><button class="tb" id="fs" style="left:112px;top:12px">⬅ Меню</button>
<script src="residents.js"></script><script type="importmap">{"imports":{"three":"./three.js"}}</script><script type="module" src="scene.js"></script></body></html>
